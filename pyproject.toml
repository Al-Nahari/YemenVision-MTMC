[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yemenvision-mtmc"
version = "0.1.0"
description = "Auditable vehicle detection, tracking, ReID, and MTMC association"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
detection = ["ultralytics>=8.3,<9", "opencv-python>=4.8,<5", "lap>=0.5.12", "rapidocr-onnxruntime>=1.2,<2"]
reid = ["torch>=2.1,<3", "torchvision>=0.16,<1", "Pillow>=10,<12"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]
evaluation = ["scipy>=1.10,<2", "pandas>=2,<3", "motmetrics>=1.4,<2"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "mypy>=1.13,<2"]
all = ["yemenvision-mtmc[detection,reid,api,evaluation,dev]"]

[project.scripts]
yv = "yemenvision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# FastAPI uses function calls (Depends/File/Header) as dependency defaults by design.
# The legacy code style intentionally uses compact one-line statements; formatting
# the whole tree is out of scope for the lint gate.
ignore = ["B008", "B905", "E701", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
