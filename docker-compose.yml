services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yemenvision-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://traffic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/traffic
      API_KEYS_JSON: ${API_KEYS_JSON:?set API_KEYS_JSON}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY}
      YV_MODELS_DIR: /models
      YV_TRUSTED_MODELS_ONLY: "true"
      YV_CORS_ORIGINS: ${YV_CORS_ORIGINS:-http://localhost:4200}
      YV_PRIVACY_BLUR_PLATES: "true"
      YV_PRIVACY_BLUR_MODE: ${YV_PRIVACY_BLUR_MODE:-plate_region}
      YV_PRIVACY_ALLOW_UNBLURRED: "false"
      YV_QUEUE_BACKEND: ${YV_QUEUE_BACKEND:-redis}
      YV_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./models:/models:ro
      - ./processed-videos:/app/processed-videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yemenvision-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://traffic:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/traffic
      API_KEYS_JSON: ${API_KEYS_JSON:?set API_KEYS_JSON}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY}
      YV_MODELS_DIR: /models
      YV_TRUSTED_MODELS_ONLY: "true"
      YV_QUEUE_BACKEND: redis
      YV_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./models:/models:ro
      - ./processed-videos:/app/processed-videos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: yemenvision-postgres
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: yemenvision-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
