name: YemenVision-MTMC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python tools/secret_scan.py .
      - run: ruff check src tests tools
      - run: python -m compileall -q src tests tools
      - run: pytest -q
      - run: mypy src tests

  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pyyaml numpy pandas scipy pillow pydantic fastapi httpx sqlalchemy
      - run: pytest research/ -q
      - run: PYTHONPATH=backend pytest backend/tests/ -q
