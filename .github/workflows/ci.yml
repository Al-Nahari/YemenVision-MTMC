name: YemenVision-MTMC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-research-and-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pyyaml numpy pandas scipy pillow pydantic fastapi httpx sqlalchemy
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Run research tests
      run: |
        pytest research/ -v

    - name: Run backend tests
      env:
        PYTHONPATH: backend
        API_KEYS_JSON: '{"admin":{"subject":"ci-tester","roles":["admin"]}}'
      run: |
        pytest backend/tests/ -v
