services:
  yemenvision:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      YV_MODELS_DIR: /models
      YV_OUTPUT_DIR: /outputs/runs
      YV_API_KEY: ${YV_API_KEY:?set YV_API_KEY}
    volumes:
      - ./models:/models:ro
      - ./outputs:/outputs
      - ./inputs:/inputs:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    read_only: true
    tmpfs:
      - /tmp
